<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Create password</title>
    <link ref="icon" href="../images/shira.jpg">
</head>
<body>
    <div class="fondo">
        <h1 class="titulo" id="titulo_cuenta">Create an acount</h1>
        <div class="formulario" id="form_pass">
            <h2 id="create">Create a password</h2>
            <p id="texto_pass">Requires at least 8 characters</p>
            <input class="escritores" id="contra_nueva" type="password" placeholder="Password">
            <button class="boton" id="crear_contraseña">Next</button>
        </div>
    </div>
    <script type="module" src="../js/create_password.js"></script>
</body>
</html>
